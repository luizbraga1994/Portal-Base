# Ambiente de DESENVOLVIMENTO local. NÃO destinado a produção.
# Segredos vêm do arquivo `.env` (ignorado pelo git); veja `.env.example`.
# Aplique as migrations antes de usar: veja o README (dotnet ef database update).

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina em .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-portalbase_catalogo}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: Dockerfile.Web
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # user=root apenas em desenvolvimento; em produção use um usuário de menor privilégio.
      ConnectionStrings__Catalogo: "server=mysql;port=3306;database=${MYSQL_DATABASE:-portalbase_catalogo};user=root;password=${MYSQL_ROOT_PASSWORD}"
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.Worker
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Catalogo: "server=mysql;port=3306;database=${MYSQL_DATABASE:-portalbase_catalogo};user=root;password=${MYSQL_ROOT_PASSWORD}"

volumes:
  mysql-data:
